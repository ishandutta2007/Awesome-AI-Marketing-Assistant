<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow-title" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Dynamic Flow Dash Animation Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
    }
    @keyframes driftPill1 {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes driftPill2 {
      0%, 100% { transform: translateY(0px) rotate(1.5deg); }
      50% { transform: translateY(-14px) rotate(-1deg); }
    }
    @keyframes driftPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 280px; }
    .pill-anim-1 { animation: driftPill1 6s ease-in-out infinite; }
    .pill-anim-2 { animation: driftPill2 7s ease-in-out infinite; }
    .pill-anim-3 { animation: driftPill3 5.5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 80, 160; animation: beamFlow 12s linear infinite; }
    .shimmer-badge { animation: shimmer 4s ease-in-out infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bg-grad)" />

  <!-- Background Grid -->
  <rect width="1200" height="380" rx="18" fill="url(#grid-pattern)" />

  <!-- Animated Glowing Ambience Orbs (Kept safely in background) -->
  <g opacity="0.6">
    <circle class="orb-1" cx="220" cy="90" r="150" fill="url(#glow-purple)" filter="blur(50px)" />
    <circle class="orb-2" cx="980" cy="270" r="170" fill="url(#glow-cyan)" filter="blur(60px)" />
    <circle cx="600" cy="190" r="210" fill="#3b82f6" opacity="0.08" filter="blur(80px)" />
  </g>

  <!-- Dynamic Animated Flow Streams (Background decoration) -->
  <g opacity="0.35">
    <path class="flow-line" d="M -50 300 C 300 240, 450 360, 850 290 C 1050 250, 1150 310, 1250 270" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M -50 90 C 250 140, 500 50, 800 110 C 1050 160, 1150 90, 1250 130" fill="none" stroke="#c084fc" stroke-width="2" style="animation-duration: 16s;" />
  </g>

  <!-- Periphery Animated Feature Badges (Safely floating outside text center) -->
  <g class="pill-anim-1" opacity="0.85">
    <g transform="translate(60, 48)">
      <rect width="168" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🤖 AI Copy Agents</text>
    </g>
  </g>

  <g class="pill-anim-2" opacity="0.85">
    <g transform="translate(970, 50)">
      <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📊 Growth Predictor</text>
    </g>
  </g>

  <g class="pill-anim-3" opacity="0.85">
    <g transform="translate(70, 305)">
      <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#f43f5e" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🚀 Campaign Optimizer</text>
    </g>
  </g>

  <g class="pill-anim-1" opacity="0.85">
    <g transform="translate(965, 305)">
      <rect width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#a855f7" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⚡ 100% Self-Hostable</text>
    </g>
  </g>

  <!-- Top Decorative Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="17" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- ======================================================== -->
  <!-- FOREGROUND LAYER: CRISP TITLES & TEXT (ALWAYS ON TOP)    -->
  <!-- ======================================================== -->
  <g id="foreground" transform="translate(600, 0)">
    
    <!-- Top Pill Category Header -->
    <g transform="translate(0, 85)" class="shimmer-badge">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c7d2fe">🌟 CURATED AI ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text text-anchor="middle" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#title-grad)" filter="url(#shadow-title)">
      Awesome AI Marketing Assistant
    </text>

    <!-- Luminous Divider Line -->
    <path d="M -240 196 L 240 196" stroke="url(#line-grad)" stroke-width="3" stroke-linecap="round" />

    <!-- Subtitle -->
    <text text-anchor="middle" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#e2e8f0" filter="url(#shadow-title)">
      Top SaaS Platforms &amp; Open-Source LLM Marketing Automation Engines
    </text>

    <!-- Description Bullet Row -->
    <text text-anchor="middle" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      Content Generation • SEO &amp; Ad Creative • Social Scheduling • Autonomous Marketing Agents
    </text>

  </g>
</svg>
